name: Upload package to PyPI
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Python package
    runs-on: ubuntu-latest

    steps:
      - name: Check out the Repo
        uses: actions/checkout@v7

      - name: Install Hatch
        uses: pypa/hatch@install

      - name: Build package
        run: hatch build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/**
          name: dist

  upload:
    name: Upload to PyPI
    environment:
      name: pypi
      url: https://pypi.org/p/ollama-response-generator-tayra
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1